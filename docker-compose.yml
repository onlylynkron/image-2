services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: ${PORT:-8787}
      DATA_DIR: /app/data
      DATABASE_URL: postgresql://image_studio:image_studio@postgres:5432/image_studio
    ports:
      - "${PORT:-8787}:${PORT:-8787}"
    volumes:
      - image_studio_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: image_studio
      POSTGRES_USER: image_studio
      POSTGRES_PASSWORD: image_studio
    volumes:
      - image_studio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

volumes:
  image_studio_data:
  image_studio_postgres:
